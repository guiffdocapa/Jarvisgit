<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - Chat Esportivo</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #0d1b2a;
      color: white;
    }

    .app { display: flex; height: 100vh; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 250px;
      background-color: #1b263b;
      padding: 20px;
      border-right: 2px solid #2c3e50;
    }

    .sidebar-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .sidebar-logo img {
      width: 80px; height: 80px;
      object-fit: contain;
      border-radius: 50%;
      background-color: #0d1b2a;
      padding: 6px;
    }

    .sidebar-logo span { font-size: 22px; font-weight: bold; }

    .esporte-botao {
      background-color: #415a77;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      font-size: 16px;
    }

    .esporte-botao:hover { background-color: #4ea8de; }

    /* ── CHAT AREA ── */
    .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .chat-header {
      background-color: #4ea8de;
      padding: 12px 20px;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .chat-header img {
      width: 36px; height: 36px;
      object-fit: contain;
      border-radius: 50%;
      background-color: #3a97cd;
      padding: 3px;
    }

    #caixa-de-chat {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mensagem {
      padding: 10px 15px;
      border-radius: 10px;
      max-width: 65%;
      word-break: break-word;
      line-height: 1.4;
    }

    .mensagem-usuario { background-color: #4ea8de; align-self: flex-end; }
    .mensagem-bot     { background-color: #415a77; align-self: flex-start; }
    .mensagem-bot-com-logo { display: flex; align-items: flex-start; gap: 10px; }

    .msg-logo {
      width: 32px; height: 32px;
      object-fit: contain;
      border-radius: 50%;
      background-color: #0d1b2a;
      padding: 3px;
      flex-shrink: 0;
    }

    /* ── IMAGEM NA MENSAGEM ── */
    .msg-imagem {
      max-width: 260px;
      max-height: 200px;
      border-radius: 8px;
      margin-top: 6px;
      display: block;
      border: 1px solid rgba(78,168,222,0.4);
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .msg-imagem:hover { opacity: 0.85; }

    /* ── ARQUIVO NA MENSAGEM ── */
    .msg-arquivo {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(78,168,222,0.35);
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 13px;
    }
    .msg-arquivo-icone { font-size: 20px; flex-shrink: 0; }
    .msg-arquivo-info { display: flex; flex-direction: column; gap: 2px; }
    .msg-arquivo-nome { font-weight: bold; font-size: 12px; word-break: break-all; }
    .msg-arquivo-tamanho { font-size: 10px; opacity: 0.6; }

    /* ── PREVIEW AREA (acima do input) ── */
    #area-preview {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px;
      background: #131f2e;
      border-top: 1px solid #2c3e50;
      max-height: 130px;
      overflow-y: auto;
    }

    #area-preview.ativo { display: flex; }

    .preview-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(78,168,222,0.4);
      background: #1b263b;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }

    .preview-item img {
      width: 80px; height: 80px;
      object-fit: cover;
      display: block;
    }

    .preview-item-arquivo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 80px; height: 80px;
      gap: 4px;
      padding: 6px;
      text-align: center;
    }

    .preview-item-arquivo .preview-icone { font-size: 24px; }
    .preview-item-arquivo .preview-nome {
      font-size: 9px;
      color: #ccc;
      word-break: break-all;
      overflow: hidden;
      max-height: 30px;
      line-height: 1.2;
    }

    .preview-remover {
      position: absolute;
      top: 2px; right: 2px;
      width: 18px; height: 18px;
      background: rgba(0,0,0,0.75);
      border: none;
      border-radius: 50%;
      color: #ff5555;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background 0.2s;
    }
    .preview-remover:hover { background: rgba(200,0,0,0.85); color: white; }

    /* ── INPUT AREA ── */
    .area-de-input {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background-color: #1b263b;
      gap: 8px;
      border-top: 1px solid #2c3e50;
      flex-shrink: 0;
    }

    /* botão de anexo */
    .btn-anexo {
      width: 40px; height: 40px;
      border: none;
      border-radius: 8px;
      background-color: #2c3e50;
      color: #4ea8de;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.2s, transform 0.15s;
      position: relative;
    }
    .btn-anexo:hover { background-color: #415a77; transform: scale(1.05); }
    .btn-anexo input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    #campo-mensagem {
      flex: 1;
      padding: 10px 15px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 15px;
      background-color: #0d1b2a;
      color: white;
    }

    #campo-mensagem::placeholder { color: #888; }

    #botao-enviar {
      padding: 10px 20px;
      height: 40px;
      border: none;
      border-radius: 8px;
      background-color: #4ea8de;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: background-color 0.2s;
      flex-shrink: 0;
    }

    #botao-enviar:hover { background-color: #3a97cd; }
    #botao-enviar:disabled { background-color: #2c3e50; cursor: not-allowed; opacity: 0.6; }

    /* ── LIGHTBOX (visualização da imagem) ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 99998;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #lightbox.ativo { display: flex; }
    #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 0 40px rgba(78,168,222,0.3); }

    /* ── TOAST NOTIFICATION ── */
    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1b263b;
      border: 1px solid #4ea8de;
      color: #4ea8de;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 9999;
    }
    #toast.visivel {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── LOADING SCREEN ── */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: 'Courier New', monospace;
      transition: opacity 0.8s ease;
    }

    #loading-screen.ocultar { opacity: 0; pointer-events: none; }

    .scanline {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,255,255,.015) 2px, rgba(0,255,255,.015) 4px);
      pointer-events: none;
    }

    .svg-frame {
      position: relative;
      width: 280px; height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .svg-frame svg { position: absolute; width: 280px; height: 280px; fill: none; }
    .svg-frame circle { filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 12px currentColor); }

    .corner { position: absolute; width: 16px; height: 16px; border-color: #00ffff; border-style: solid; opacity: .5; }
    .corner-tl { top: -8px;    left: -8px;  border-width: 1.5px 0 0 1.5px; }
    .corner-tr { top: -8px;    right: -8px; border-width: 1.5px 1.5px 0 0; }
    .corner-bl { bottom: -8px; left: -8px;  border-width: 0 0 1.5px 1.5px; }
    .corner-br { bottom: -8px; right: -8px; border-width: 0 1.5px 1.5px 0; }

    #out2   { animation: spin     12s linear infinite; transform-origin: center; }
    #out3   { animation: spin      6s linear infinite; transform-origin: center; }
    #inner1 { animation: spin-rev  8s linear infinite; transform-origin: center; }
    #inner3 { animation: spin      5s linear infinite; transform-origin: center; }

    @keyframes spin     { to { transform: rotate(360deg);  } }
    @keyframes spin-rev { to { transform: rotate(-360deg); } }

    #center1 {
      fill: #ffdd00;
      animation: pulse 2s ease-in-out infinite;
      transform-origin: 172px 172px;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 1;  }
      50%       { transform: scale(1.6); opacity: .7; }
    }

    .info-panel { margin-top: 52px; text-align: center; }

    .system-name {
      color: #00ffff;
      font-size: 13px;
      letter-spacing: 6px;
      text-transform: uppercase;
      opacity: .85;
      margin-bottom: 20px;
      animation: flicker 4s infinite;
    }

    @keyframes flicker {
      0%, 95%, 100% { opacity: .85; }
      96% { opacity: .3;  }
      97% { opacity: .85; }
      98% { opacity: .5;  }
      99% { opacity: .85; }
    }

    .progress-label { color: #ccee00; font-size: 10px; letter-spacing: 3px; margin-bottom: 10px; opacity: .7; }

    .progress-bar-wrap {
      width: 240px; height: 3px;
      background: rgba(0,255,255,.1);
      border: .5px solid rgba(0,255,255,.2);
      margin: 0 auto 12px;
      overflow: hidden;
    }

    .progress-bar-fill { height: 100%; width: 0%; background: #00ffff; box-shadow: 0 0 8px #00ffff; transition: width .08s linear; }

    .status-text  { color: #00ffff; font-size: 10px; letter-spacing: 2px; opacity: .5; height: 14px; }
    .pct-display  { color: #ffdd00; font-size: 11px; letter-spacing: 2px; margin-top: 8px; opacity: .8; }

    /* ── TELA INÍCIO ── */
    #tela-inicio {
      position: fixed;
      inset: 0;
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-family: 'Courier New', monospace;
    }

    #tela-inicio p {
      color: #00ffff;
      font-size: 11px;
      letter-spacing: 5px;
      opacity: 0.5;
      margin-bottom: 40px;
      animation: flicker 4s infinite;
    }

    #btn-iniciar {
      position: relative;
      background: transparent;
      border: none;
      color: #00ffff;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 6px;
      padding: 20px 52px;
      cursor: pointer;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    #btn-iniciar::before,
    #btn-iniciar::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid #00ffff;
      opacity: 0.4;
      transition: opacity 0.3s, transform 0.3s;
    }

    #btn-iniciar::after {
      transform: scale(1.08);
      opacity: 0.15;
    }

    #btn-iniciar:hover { color: #ffffff; }
    #btn-iniciar:hover::before { opacity: 0.9; }
    #btn-iniciar:hover::after  { transform: scale(1.15); opacity: 0.3; }

    /* ── DRAG OVER ── */
    .chat-area.drag-over #caixa-de-chat {
      background: rgba(78,168,222,0.06);
      outline: 2px dashed rgba(78,168,222,0.5);
      outline-offset: -8px;
    }
  </style>
</head>

<body>

  <!-- tela inicial -->
  <div id="tela-inicio">
    <p>SISTEMA OFFLINE</p>
    <button id="btn-iniciar" onclick="iniciarJarvis()">▶ INICIAR JARVIS</button>
  </div>

  <audio id="som-loading" src="jarvis.mp3" preload="auto"></audio>

  <!-- loading -->
  <div id="loading-screen">
    <div class="scanline"></div>
    <div class="svg-frame">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <svg viewBox="0 0 344 344"><circle cx="172" cy="172" r="138" stroke="#00ffff" stroke-width="2.5" stroke-dasharray="60 18 30 18 80 18 40 18" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 344 344"><g id="out2"><circle cx="172" cy="172" r="108" stroke="#ccee00" stroke-width="2" stroke-dasharray="50 15 25 15 65 15" stroke-linecap="round"/></g></svg>
      <svg viewBox="0 0 344 344"><g id="out3"><circle cx="172" cy="172" r="80" stroke="#00ffff" stroke-width="2" stroke-dasharray="40 14 20 14 55 14"/></g></svg>
      <svg viewBox="0 0 344 344"><g id="inner1"><circle cx="172" cy="172" r="55" stroke="#ddcc00" stroke-width="2" stroke-dasharray="30 12 18 12 40 12"/></g></svg>
      <svg viewBox="0 0 344 344"><g id="inner3"><circle cx="172" cy="172" r="35" stroke="#00ffff" stroke-width="2" stroke-dasharray="22 10 14 10"/></g></svg>
      <svg viewBox="0 0 344 344"><g id="center"><circle id="center1" cx="172" cy="172" r="10"/></g></svg>
    </div>
    <div class="info-panel">
      <div class="system-name">J.A.R.V.I.S</div>
      <div class="progress-label" id="stage-label">INICIALIZANDO SISTEMA</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="pbar"></div></div>
      <div class="status-text" id="status-text">AGUARDANDO...</div>
      <div class="pct-display" id="pct-display">0%</div>
    </div>
  </div>

  <!-- lightbox para visualizar imagens em tela cheia -->
  <div id="lightbox" onclick="fecharLightbox()">
    <img id="lightbox-img" src="" alt="Imagem ampliada">
  </div>

  <!-- toast de notificação -->
  <div id="toast"></div>

  <!-- app -->
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-logo">
        <img src="reator.png" alt="Logo JARVIS">
        <span>JARVIS</span>
      </div>
      <div class="esporte-botao" onclick="escolherEsporte('Futebol')">⚽ Futebol</div>
      <div class="esporte-botao" onclick="escolherEsporte('Basquete')">🏀 Basquete</div>
      <div class="esporte-botao" onclick="escolherEsporte('Futebol Americano')">🏈 Fut. Americano</div>
      <div class="esporte-botao" onclick="escolherEsporte('Tênis')">🎾 Tênis</div>
      <div class="esporte-botao" onclick="escolherEsporte('Vôlei')">🏐 Vôlei</div>
    </div>

    <div class="chat-area" id="chat-area">
      <div class="chat-header">
        <img src="reator.png" alt="Logo JARVIS">
        JARVIS - Assistente Esportivo
      </div>

      <div id="caixa-de-chat"></div>

      <!-- preview dos arquivos selecionados -->
      <div id="area-preview"></div>

      <!-- barra de input -->
      <div class="area-de-input">

        <!-- botão de imagem -->
        <button class="btn-anexo" title="Enviar imagem">
          📷
          <input type="file" id="input-imagem" accept="image/*" multiple onchange="selecionarArquivos(this.files, 'imagem')">
        </button>

        <!-- botão de arquivo -->
        <button class="btn-anexo" title="Anexar arquivo">
          📎
          <input type="file" id="input-arquivo" accept=".pdf,.doc,.docx,.txt,.csv,.xlsx,.xls,.pptx,.zip" multiple onchange="selecionarArquivos(this.files, 'arquivo')">
        </button>

        <input
          type="text"
          id="campo-mensagem"
          placeholder="Digite sua pergunta sobre esportes..."
          onkeypress="verificarEnter(event)"
        >
        <button id="botao-enviar" onclick="enviarMensagem()">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    // ── ESTADO GLOBAL ──────────────────────────────────────────────────────────
    const caixaChat = document.getElementById("caixa-de-chat");
    const areaPreview = document.getElementById("area-preview");
    let esporteSelecionado = "";

    // lista de arquivos pendentes (aguardando envio)
    // cada item: { file: File, tipo: 'imagem'|'arquivo', dataURL: string, id: string }
    let arquivosPendentes = [];

    // ── DADOS DE RESPOSTAS ─────────────────────────────────────────────────────
    const respostasEsportes = {
      "Futebol":           ["Hoje tem jogo do Brasileirão! ⚽", "O Palmeiras tá na liderança essa semana!", "Copa do Mundo tá chegando, bora torcer!", "Campeonato Paulista foi insano com o Palmeiras sendo campeão 🔥"],
      "Basquete":          ["NBA com jogos incríveis essa semana! 🏀", "LeBron James fez 40 pontos ontem!", "NBB também tá demais aqui no Brasil!", "Os playoffs tão chegando, fica ligado 👀"],
      "Futebol Americano": ["NFL no domingo como sempre! 🏈", "Super Bowl foi épico esse ano!", "Tem jogo de Thursday Night Football hoje!", "Patrick Mahomes tá dominando demais 🐐"],
      "Tênis":             ["Roland Garros começa em breve! 🎾", "Alcaraz tá na final de novo!", "Iga Swiatek continua invicta no saibro", "Wimbledon é o torneio mais chique 🏆"],
      "Vôlei":             ["Brasil é penta no vôlei! 🏐", "Superliga feminina tá incrível esse ano!", "Gabi Guimarães é a melhor do mundo!", "Liga das Nações começa em breve 🌍"]
    };

    const respostasGenericas = [
      "Boa pergunta! Não sei responder ainda, mas tô aprendendo 🤖",
      "Hmm, não tenho essa informação agora... tenta me perguntar sobre um esporte específico!",
      "Estou analisando sua pergunta... 🤔 Me conta mais!",
      "Isso é sobre esportes? Me conta mais detalhes!"
    ];

    const respostasArquivo = [
      "Recebi o arquivo! Analisando conteúdo... 📄",
      "Arquivo recebido com sucesso. Processando dados! 🔍",
      "Arquivo carregado! Posso analisar esse conteúdo pra você 📊"
    ];

    const respostasImagem = [
      "Imagem recebida! Identificando elementos visuais... 🔭",
      "Legal! Analisando sua imagem agora 🖼️",
      "Imagem carregada com sucesso! O que quer saber sobre ela? 👁️"
    ];

    const palavrasChave = {
      "Futebol":           ["futebol", "gol", "bola"],
      "Basquete":          ["basquete", "nba", "basketball"],
      "Futebol Americano": ["americano", "nfl", "touchdown"],
      "Tênis":             ["tenis", "tênis", "raquete"],
      "Vôlei":             ["volei", "vôlei", "brasil"]
    };

    // ── HELPERS ───────────────────────────────────────────────────────────────
    function aleatorio(lista) {
      return lista[Math.floor(Math.random() * lista.length)];
    }

    function formatarTamanho(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function iconePorExtensao(nome) {
      const ext = nome.split('.').pop().toLowerCase();
      const icones = {
        pdf: "📕", doc: "📘", docx: "📘", txt: "📄",
        csv: "📊", xlsx: "📊", xls: "📊",
        pptx: "📙", ppt: "📙", zip: "🗜️", rar: "🗜️"
      };
      return icones[ext] || "📄";
    }

    function gerarId() {
      return Math.random().toString(36).slice(2, 9);
    }

    // ── TOAST ─────────────────────────────────────────────────────────────────
    function mostrarToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("visivel");
      setTimeout(() => t.classList.remove("visivel"), 2500);
    }

    // ── LIGHTBOX ──────────────────────────────────────────────────────────────
    function abrirLightbox(src) {
      document.getElementById("lightbox-img").src = src;
      document.getElementById("lightbox").classList.add("ativo");
    }

    function fecharLightbox() {
      document.getElementById("lightbox").classList.remove("ativo");
    }

    // fecha lightbox com ESC
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") fecharLightbox();
    });

    // ── SELEÇÃO DE ARQUIVOS ───────────────────────────────────────────────────
    const MAX_ARQUIVOS = 5;
    const MAX_TAMANHO  = 20 * 1024 * 1024; // 20 MB por arquivo

    function selecionarArquivos(files, tipo) {
      Array.from(files).forEach(function(file) {
        // validações
        if (arquivosPendentes.length >= MAX_ARQUIVOS) {
          mostrarToast("Máximo de " + MAX_ARQUIVOS + " arquivos por mensagem.");
          return;
        }
        if (file.size > MAX_TAMANHO) {
          mostrarToast(file.name + " excede 20 MB.");
          return;
        }

        const id = gerarId();
        const reader = new FileReader();

        reader.onload = function(e) {
          const dataURL = e.target.result;
          arquivosPendentes.push({ file, tipo, dataURL, id });
          renderizarPreview();
        };

        reader.readAsDataURL(file);
      });

      // limpa o input pra permitir re-selecionar o mesmo arquivo
      document.getElementById("input-imagem").value  = "";
      document.getElementById("input-arquivo").value = "";
    }

    function removerPendente(id) {
      arquivosPendentes = arquivosPendentes.filter(function(a) { return a.id !== id; });
      renderizarPreview();
    }

    function renderizarPreview() {
      areaPreview.innerHTML = "";

      if (arquivosPendentes.length === 0) {
        areaPreview.classList.remove("ativo");
        return;
      }

      areaPreview.classList.add("ativo");

      arquivosPendentes.forEach(function(item) {
        const div = document.createElement("div");
        div.className = "preview-item";

        if (item.tipo === "imagem") {
          const img = document.createElement("img");
          img.src = item.dataURL;
          img.alt = item.file.name;
          div.appendChild(img);
        } else {
          const inner = document.createElement("div");
          inner.className = "preview-item-arquivo";

          const icone = document.createElement("span");
          icone.className = "preview-icone";
          icone.textContent = iconePorExtensao(item.file.name);

          const nome = document.createElement("span");
          nome.className = "preview-nome";
          nome.textContent = item.file.name;

          inner.appendChild(icone);
          inner.appendChild(nome);
          div.appendChild(inner);
        }

        const btn = document.createElement("button");
        btn.className = "preview-remover";
        btn.textContent = "✕";
        btn.title = "Remover";
        btn.onclick = (function(id) { return function() { removerPendente(id); }; })(item.id);
        div.appendChild(btn);

        areaPreview.appendChild(div);
      });
    }

    // ── ADICIONAR MENSAGEM ────────────────────────────────────────────────────
    function adicionarMensagem(texto, tipo, anexos) {
      const msg = document.createElement("div");
      msg.classList.add("mensagem", tipo);
      caixaChat.appendChild(msg);

      if (tipo === "mensagem-bot") {
        // logo + texto animado
        const img = document.createElement("img");
        img.src = "reator.png"; img.alt = "JARVIS"; img.className = "msg-logo";
        msg.classList.add("mensagem-bot-com-logo");
        msg.appendChild(img);

        const wrapper = document.createElement("div");
        msg.appendChild(wrapper);

        if (texto) {
          const span = document.createElement("span");
          wrapper.appendChild(span);
          let i = 0;
          const intervalo = setInterval(function() {
            span.textContent += texto[i++];
            caixaChat.scrollTop = caixaChat.scrollHeight;
            if (i >= texto.length) clearInterval(intervalo);
          }, 18);
        }
      } else {
        // mensagem do usuário
        if (texto) {
          const p = document.createElement("p");
          p.textContent = texto;
          msg.appendChild(p);
        }

        // exibe imagens e arquivos anexados
        if (anexos && anexos.length > 0) {
          anexos.forEach(function(item) {
            if (item.tipo === "imagem") {
              const img = document.createElement("img");
              img.src = item.dataURL;
              img.alt = item.file.name;
              img.className = "msg-imagem";
              img.title = "Clique para ampliar";
              img.onclick = (function(src) { return function() { abrirLightbox(src); }; })(item.dataURL);
              msg.appendChild(img);
            } else {
              const divArq = document.createElement("div");
              divArq.className = "msg-arquivo";

              const icone = document.createElement("span");
              icone.className = "msg-arquivo-icone";
              icone.textContent = iconePorExtensao(item.file.name);

              const info = document.createElement("div");
              info.className = "msg-arquivo-info";

              const nome = document.createElement("span");
              nome.className = "msg-arquivo-nome";
              nome.textContent = item.file.name;

              const tamanho = document.createElement("span");
              tamanho.className = "msg-arquivo-tamanho";
              tamanho.textContent = formatarTamanho(item.file.size);

              info.appendChild(nome);
              info.appendChild(tamanho);
              divArq.appendChild(icone);
              divArq.appendChild(info);
              msg.appendChild(divArq);
            }
          });
        }
      }

      caixaChat.scrollTop = caixaChat.scrollHeight;
    }

    // ── ESCOLHER ESPORTE ──────────────────────────────────────────────────────
    function escolherEsporte(nomeEsporte) {
      esporteSelecionado = nomeEsporte;
      adicionarMensagem(nomeEsporte, "mensagem-usuario");
      setTimeout(function() {
        adicionarMensagem(aleatorio(respostasEsportes[nomeEsporte]), "mensagem-bot");
      }, 600);
    }

    function detectarEsporte(texto) {
      const lower = texto.toLowerCase();
      for (const esporte in palavrasChave) {
        if (palavrasChave[esporte].some(function(p) { return lower.includes(p); }))
          return esporte;
      }
      return null;
    }

    // ── ENVIAR MENSAGEM ───────────────────────────────────────────────────────
    function enviarMensagem() {
      const campo  = document.getElementById("campo-mensagem");
      const texto  = campo.value.trim();
      const anexos = [...arquivosPendentes];

      // precisa de texto OU de pelo menos um arquivo
      if (!texto && anexos.length === 0) return;

      // exibe a mensagem do usuário com os anexos
      adicionarMensagem(texto, "mensagem-usuario", anexos);

      // limpa estado
      campo.value = "";
      arquivosPendentes = [];
      renderizarPreview();

      // resposta do bot
      setTimeout(function() {
        const temImagens  = anexos.some(function(a) { return a.tipo === "imagem"; });
        const temArquivos = anexos.some(function(a) { return a.tipo === "arquivo"; });

        let resposta;
        if (temImagens && !texto) {
          resposta = aleatorio(respostasImagem);
        } else if (temArquivos && !texto) {
          resposta = aleatorio(respostasArquivo);
        } else if (temImagens || temArquivos) {
          const esporte = detectarEsporte(texto);
          const base = esporte ? aleatorio(respostasEsportes[esporte]) : aleatorio(respostasGenericas);
          const extra = temImagens ? " (e já vi sua imagem 📷)" : " (e recebi seu arquivo 📎)";
          resposta = base + extra;
        } else {
          const esporte = detectarEsporte(texto);
          resposta = esporte ? aleatorio(respostasEsportes[esporte]) : aleatorio(respostasGenericas);
        }

        adicionarMensagem(resposta, "mensagem-bot");
      }, 700);
    }

    function verificarEnter(evento) {
      if (evento.key === "Enter") enviarMensagem();
    }

    // ── DRAG & DROP na área de chat ───────────────────────────────────────────
    const chatArea = document.getElementById("chat-area");

    chatArea.addEventListener("dragover", function(e) {
      e.preventDefault();
      chatArea.classList.add("drag-over");
    });

    chatArea.addEventListener("dragleave", function(e) {
      if (!chatArea.contains(e.relatedTarget)) {
        chatArea.classList.remove("drag-over");
      }
    });

    chatArea.addEventListener("drop", function(e) {
      e.preventDefault();
      chatArea.classList.remove("drag-over");

      const files = e.dataTransfer.files;
      if (!files.length) return;

      Array.from(files).forEach(function(file) {
        const tipo = file.type.startsWith("image/") ? "imagem" : "arquivo";
        selecionarArquivos([file], tipo);
      });

      mostrarToast(files.length + " arquivo(s) adicionado(s)!");
    });

    // ── COLAR IMAGEM DO CLIPBOARD (Ctrl+V) ────────────────────────────────────
    document.addEventListener("paste", function(e) {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      Array.from(items).forEach(function(item) {
        if (item.type.startsWith("image/")) {
          const file = item.getAsFile();
          if (file) selecionarArquivos([file], "imagem");
        }
      });
    });

    // ── LOADING ───────────────────────────────────────────────────────────────
    const stages   = ["INICIALIZANDO SISTEMA","CARREGANDO MÓDULOS","CALIBRANDO SENSORES","VERIFICANDO INTEGRIDADE","SINCRONIZANDO IA","SISTEMA PRONTO"];
    const statuses = ["BOOT SEQUENCE STARTED...","LOADING CORE MODULES...","SENSOR ARRAY ONLINE...","INTEGRITY CHECK: OK","AI SYNC IN PROGRESS...","ALL SYSTEMS NOMINAL"];

    let pct = 0, stageIdx = 0;
    const pbar       = document.getElementById("pbar");
    const stageLabel = document.getElementById("stage-label");
    const statusText = document.getElementById("status-text");
    const pctDisplay = document.getElementById("pct-display");
    const loading    = document.getElementById("loading-screen");

    function tick() {
      if (pct < 100) pct = Math.min(pct + Math.random() * 2.2, 100);

      const p = Math.round(pct);
      pctDisplay.textContent = p + "%";
      pbar.style.width = p + "%";

      const idx = Math.min(Math.floor(pct / 17), stages.length - 1);
      if (idx !== stageIdx) {
        stageIdx = idx;
        stageLabel.textContent = stages[idx];
        statusText.textContent = statuses[idx];
      }

      if (pct >= 100) {
        stageLabel.textContent = stages[5];
        statusText.textContent = statuses[5];
        pctDisplay.textContent = "100%";
        setTimeout(function() {
          loading.classList.add("ocultar");
          setTimeout(function() {
            loading.style.display = "none";
            adicionarMensagem(
              "Olá! Eu sou o JARVIS. Escolha um esporte, me pergunte qualquer coisa — ou envie uma imagem 📷 e um arquivo 📎 usando os botões no chat!",
              "mensagem-bot"
            );
          }, 800);
        }, 1800);
        return;
      }

      setTimeout(tick, 80);
    }

    function iniciarJarvis() {
      document.getElementById("tela-inicio").style.display = "none";
      document.getElementById("som-loading").play();
      tick();
    }
  </script>

</body>
</html>
